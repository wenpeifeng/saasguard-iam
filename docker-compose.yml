services:
  mysql:
    image: mysql:8
    container_name: auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: auth123456
      MYSQL_DATABASE: auth_db
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "13306:3306"
    volumes:
      - auth-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pauth123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "auth123456", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "auth123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  auth-mysql-data:
  auth-redis-data:
