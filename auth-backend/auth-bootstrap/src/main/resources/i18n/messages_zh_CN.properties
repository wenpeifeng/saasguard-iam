# ============================================================
# ERP 后端国际化文案 —— 中文（zh_CN，基准语言）
# 英文版：messages_en.properties（两文件 key 必须完全一致，见 docs/modules/i18n.md）
#
# 命名规范：
#   auth.error.*  框架层/错误码（ErrorCode.codeKey）+ 异常处理器明细文案
#   auth.biz.*    跨模块高频业务提示（BusinessException.ofKey 引用）
# 占位符：MessageFormat 风格 {0} {1}...（英文文件中出现英文单引号需写成 ''）
# 兜底：英文缺 key 时自动回退本文件（ErpMessages），永不向前端返回 key 原样
# ============================================================

# ================= auth.error.* 框架层（ErrorCode 枚举） =================
auth.error.success=操作成功
auth.error.bad-request=请求参数错误
auth.error.unauthorized=未登录或登录已过期
auth.error.forbidden=没有访问权限
auth.error.not-found=资源不存在
auth.error.method-not-allowed=请求方式不支持
auth.error.internal-error=系统内部异常
auth.error.service-unavailable=服务暂不可用
auth.error.business-error=业务处理失败
auth.error.duplicate-data=数据已存在，请勿重复提交
auth.error.data-not-exists=数据不存在或已被删除
auth.error.data-in-use=数据被引用，无法删除

# ---- 异常处理器明细（带参数） ----
# {0} = 具体字段校验错误拼接
auth.error.validation-failed=请求参数校验失败：{0}
# {0} = 参数名
auth.error.missing-param=缺少必填参数: {0}
# {0} = 参数名
auth.error.type-mismatch=参数类型错误: {0}
# {0} = 请求路径
auth.error.not-found-detail=接口不存在: {0}

# ================= auth.biz.* 通用业务提示 =================

# ---- 认证 / 权限 ----
auth.biz.login-failed=账号或密码错误
# {0} = 重试等待说明
auth.biz.account-locked=密码错误次数过多，账号已锁定，请 {0} 后重试
auth.biz.account-disabled=账号已停用，请联系管理员
auth.biz.permission-denied=权限不足
auth.biz.not-logged-in=未登录或登录已过期

# ---- 通用数据 ----
auth.biz.data-not-exists=数据不存在
auth.biz.data-exists=数据已存在，请勿重复提交
auth.biz.duplicate-submit=请勿重复提交
auth.biz.data-in-use=数据被其他记录引用，无法删除
# {0} = 编码值
auth.biz.code-exists=编码已存在：{0}
# {0} = 名称值
auth.biz.name-exists=名称已存在：{0}
auth.biz.concurrent-conflict=并发冲突，请刷新后重试
auth.biz.save-failed=保存失败

# ---- 单据通用 ----
# {0} = 单据编号或 id
auth.biz.doc-not-exists=单据不存在：{0}
# {0} = 单据编号
auth.biz.doc-audited=单据[{0}]已审核，请勿重复审核
# {0} = 单据编号
auth.biz.doc-not-audited=单据[{0}]未审核，请先审核
# {0} = 单据编号
auth.biz.doc-posted=单据[{0}]已审核过账，不允许删除/修改
auth.biz.doc-no-lines=单据没有明细行，无法审核
auth.biz.status-not-allowed=当前状态不允许该操作
# {0} = 会计期间
auth.biz.period-closed=期间[{0}]已结账，不允许改动

# ---- 库存 ----
# {0} = 仓库，{1} = 物料，{2} = 数量说明
auth.biz.stock-not-enough=库存不足：仓库[{0}]物料[{1}]现存量不满足{2}
# {0} = 仓库，{1} = 物料，{2} = 批次
auth.biz.batch-stock-not-enough=指定批次库存不足：仓库[{0}]物料[{1}]批次[{2}]
auth.biz.qty-positive=数量必须大于0
auth.biz.same-warehouse=调出仓与调入仓不能相同
# {0} = 物料
auth.biz.batch-required=物料[{0}]启用批次管理，必须指定批次号
# {0} = 物料
auth.biz.batch-not-allowed=物料[{0}]未启用批次管理，不能指定批次出库

# ---- 通用操作 ----
auth.biz.too-frequent=操作过于频繁，请稍后再试
auth.biz.export-failed=导出失败
auth.biz.import-format-error=导入失败：文件格式错误
auth.biz.already-disabled=已停用，不允许操作
