# ============================================================
# ERP backend i18n messages - English (en)
# Base language: messages_zh_CN.properties (keys MUST match exactly, see docs/modules/i18n.md)
#
# Naming convention:
#   auth.error.*  framework / error codes (ErrorCode.codeKey) + exception handler details
#   auth.biz.*    cross-module business messages (referenced by BusinessException.ofKey)
# Placeholders: MessageFormat style {0} {1}... (single quotes must be escaped as '')
# Fallback: missing keys here fall back to the zh_CN base bundle (ErpMessages)
# ============================================================

# ================= auth.error.* framework (ErrorCode enum) =================
auth.error.success=Operation succeeded
auth.error.bad-request=Invalid request parameters
auth.error.unauthorized=Not signed in or session has expired
auth.error.forbidden=Access denied
auth.error.not-found=Resource not found
auth.error.method-not-allowed=HTTP method not supported
auth.error.internal-error=Internal server error
auth.error.service-unavailable=Service temporarily unavailable
auth.error.business-error=Business processing failed
auth.error.duplicate-data=Data already exists; please do not resubmit
auth.error.data-not-exists=Data does not exist or has been deleted
auth.error.data-in-use=Data is referenced by other records and cannot be deleted

# ---- Exception handler details (parameterized) ----
# {0} = joined field validation errors
auth.error.validation-failed=Request validation failed: {0}
# {0} = parameter name
auth.error.missing-param=Missing required parameter: {0}
# {0} = parameter name
auth.error.type-mismatch=Parameter type mismatch: {0}
# {0} = request path
auth.error.not-found-detail=Endpoint not found: {0}

# ================= auth.biz.* common business messages =================

# ---- Auth / permission ----
auth.biz.login-failed=Incorrect username or password
# {0} = retry hint
auth.biz.account-locked=Account locked due to too many failed attempts; please retry after {0}
auth.biz.account-disabled=Account has been disabled; please contact the administrator
auth.biz.permission-denied=Insufficient permission
auth.biz.not-logged-in=Not signed in or session has expired

# ---- Common data ----
auth.biz.data-not-exists=Data does not exist
auth.biz.data-exists=Data already exists; please do not resubmit
auth.biz.duplicate-submit=Duplicate submission is not allowed
auth.biz.data-in-use=Data is referenced by other records and cannot be deleted
# {0} = code value
auth.biz.code-exists=Code already exists: {0}
# {0} = name value
auth.biz.name-exists=Name already exists: {0}
auth.biz.concurrent-conflict=Concurrent conflict; please refresh and try again
auth.biz.save-failed=Failed to save

# ---- Documents ----
# {0} = document no or id
auth.biz.doc-not-exists=Document does not exist: {0}
# {0} = document no
auth.biz.doc-audited=Document [{0}] has already been approved; do not approve again
# {0} = document no
auth.biz.doc-not-audited=Document [{0}] is not approved; please approve it first
# {0} = document no
auth.biz.doc-posted=Document [{0}] has been approved and posted; modification or deletion is not allowed
auth.biz.doc-no-lines=The document has no detail lines and cannot be approved
auth.biz.status-not-allowed=The current status does not allow this operation
# {0} = accounting period
auth.biz.period-closed=Period [{0}] has been closed; no changes are allowed

# ---- Inventory ----
# {0} = warehouse, {1} = material, {2} = quantity detail
auth.biz.stock-not-enough=Insufficient stock: warehouse [{0}] material [{1}], on-hand quantity cannot satisfy {2}
# {0} = warehouse, {1} = material, {2} = batch
auth.biz.batch-stock-not-enough=Insufficient stock of the specified batch: warehouse [{0}] material [{1}] batch [{2}]
auth.biz.qty-positive=Quantity must be greater than 0
auth.biz.same-warehouse=Transfer-out warehouse and transfer-in warehouse cannot be the same
# {0} = material
auth.biz.batch-required=Material [{0}] has batch management enabled; a batch number is required
# {0} = material
auth.biz.batch-not-allowed=Material [{0}] does not have batch management enabled; batch issue is not allowed

# ---- Common operations ----
auth.biz.too-frequent=Too many requests; please try again later
auth.biz.export-failed=Export failed
auth.biz.import-format-error=Import failed: invalid file format
auth.biz.already-disabled=The record is disabled; operation is not allowed
