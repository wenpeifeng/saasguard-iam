name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and identity-chain tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: auth123456
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pauth123456 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package backend
        run: mvn -q -f auth-backend/pom.xml -DskipTests package
      - name: Start isolated Redis
        run: docker run --rm -d --name saasguard-chain-redis -p 26379:6379 redis:7-alpine redis-server --requirepass chain-test-only
      - name: Run identity-chain integration tests
        working-directory: auth-backend/auth-bootstrap
        env:
          AUTH_CHAIN_TESTS: 'true'
          AUTH_TEST_REDIS_PORT: '26379'
          AUTH_TEST_MYSQL_PASSWORD: auth123456
        run: mvn -q -f ../pom.xml -pl auth-bootstrap -am test -Dtest=IdentityChainIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@9
      - name: Install dependencies
        working-directory: auth-web
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: auth-web
        run: pnpm build
